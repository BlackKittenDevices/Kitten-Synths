# Kitten Synths: builds the installable firmware package (.fwsc) and the site (installer + web editor + simulator).
# It takes SLOOP from its own repository at a pinned commit, applies muug.patch (Muug engine, the LITE 4th synth part,
# the web editor with 5 tracks and MIDI IN), runs the tests and builds with JieLi's toolchain.
# Run it by hand: Actions > build > Run workflow. The result is the artifact "kitten-synths".
name: build
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Etiqueta de la Release a crear con el paquete (por ejemplo v2.8-kitten). Vacío: no publica"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["muug.patch", "fix-*.patch", "splashes y logos/**", ".github/workflows/build.yml"]

env:
  SLOOP_COMMIT: ec9e53721cc576816a5750220391f2d0217c01cb     # SLOOP 2.8 (isod89/sloop-fm1)
  FM1_IDENTITY: FM-1_969                                      # identidad propia en el Firmware Hub (928 y 931 ya estan en uso)
  VERSION: 2.8-kitten                                         # one digit each, then a suffix (tools/build.py --release): the editor reads "2.8" as the SLOOP version

jobs:
  build:
    permissions:
      contents: write                                             # only to publish a Release (the input above)
    env:
      KITTEN_ART: ${{ github.workspace }}/splashes y logos          # the kitten pictures for the installer, the editor and the icons (tools/kitten_img.py)
    runs-on: ubuntu-22.04                                      # x86-64: the JieLi toolchain runs natively
    steps:
      - uses: actions/checkout@v4

      - name: SLOOP at the pinned commit
        run: |
          git clone https://github.com/isod89/sloop-fm1.git sloop
          cd sloop && git checkout "$SLOOP_COMMIT"

      - name: Kitten Synths patches (muug.patch, then fix-*.patch in order)
        run: |
          cd sloop
          for p in ../muug.patch ../fix-*.patch; do echo "applying $p"; git apply --index "$p"; done

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install pillow fonttools
      - name: clang and lld, with wasm-ld for the browser simulator (Ubuntu 22.04 calls it wasm-ld-14)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld
          command -v wasm-ld || sudo ln -sf "$(ls /usr/bin/wasm-ld-* /usr/lib/llvm-*/bin/wasm-ld 2>/dev/null | head -1)" /usr/local/bin/wasm-ld
          wasm-ld --version

      - name: JieLi toolchain
        run: cd sloop && sh tools/get_toolchain.sh

      - name: JieLi SDK (three of its files are used)
        run: git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: Check the firmware unit first (the device compiles felucca.c with its own include order; this catches an order error in seconds)
        run: |
          cd sloop && mkdir -p build/gen
          for g in "tables felucca_tables.h" "fm6_patches felucca_fm6.h" "samples felucca_samples.h" "drumkits felucca_drumkits.h" "font felucca_font.h" "icons felucca_icons.h" "logo sloop_logo.h"; do
            set -- $g; python3 tools/gen_$1.py build/gen/$2 > /dev/null
          done
          clang -fsyntax-only -ffreestanding -m32 -Os -Wall -Wno-unused-function -fno-builtin -Ifirmware/hal -Ifirmware/src -Ibuild/gen -DFELUCCA_ID='"FM-1_928"' firmware/src/felucca.c

      - name: Build the firmware
        shell: bash
        run: |
          set -o pipefail
          cd sloop && bash ./build.sh --release "$VERSION" 2>&1 | tee ../build.log

      - name: The end of the build log (if it failed)
        if: failure()
        run: tail -n 60 build.log || true

      - name: Size of the firmware
        run: |
          cd sloop && ls -l build/ build/loader/ | tee ../size.log
          python3 -c "import os; n=os.path.getsize('build/felucca.bin'); print('FLASH: image %d B of 581564 B, free %d B' % (n, 581564-n))" | tee -a ../size.log
          # the same line as an annotation (readable on the run's page and through the API without downloading the artifact)
          python3 -c "import os; n=os.path.getsize('build/felucca.bin'); print('::notice title=FLASH::image %d B of 581564 B, free %d B' % (n, 581564-n))"
          if grep -q "boot logo as text" ../build.log; then echo "::warning title=LOGO::the flash was full: the boot logo was built as text"; fi
          grep -i -E "ram|flash|size|bytes|free|overflow" ../build.log | tail -20 | tee -a ../size.log || true

      - name: Tests (the host suite and the web editor)
        continue-on-error: true
        run: |
          cd sloop
          sh tests/run_tests.sh 2>&1 | tee ../tests.log
          node web/test_web.mjs 2>&1 | tail -3 | tee -a ../tests.log

      - name: Site (installer, web editor)
        run: |
          cd sloop
          python3 web/make_site.py "build/felucca-$VERSION.fwsc" "$VERSION" ../kitten-synths/site
          if ! python3 tools/build_preview.py > ../preview.log 2>&1; then echo "::error title=PREVIEW::$(grep -v '^ ' ../preview.log | tail -n 14 | cut -c1-200 | tr '\n' '|')"; exit 1; fi
          if ! python3 tools/build_demo.py > ../demo.log 2>&1; then echo "::error title=SIMULATOR::$(tail -n 8 ../demo.log | tr '\n' '|')"; exit 1; fi
          cp -r build/demo ../kitten-synths/simulator
          test -f ../kitten-synths/simulator/index.html && test -f ../kitten-synths/simulator/sloop-preview.wasm
          cp "build/felucca-$VERSION.fwsc" ../kitten-synths/
          cp ../servir.py ../kitten-synths/servir.py
          mkdir -p ../kitten-synths/docs && cp ../*.md ../LICENSE ../kitten-synths/docs/ 2>/dev/null || true

      - name: The site on GitHub Pages (The Firmware Hub's play and editor keys, fmhub.json)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: |
          rm -rf pages && cp -r kitten-synths pages && cd pages
          rm -f *.fwsc servir.py
          cat > index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Kitten Synths</title>
          <meta http-equiv="refresh" content="0; url=simulator/index.html?mock=1">
          <a href="simulator/index.html?mock=1">Kitten Synths in the browser</a> · <a href="site/webapp/editor/">Web editor</a> · <a href="site/webapp/installer/">Installer</a>
          HTML
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitten-synths
          path: |
            kitten-synths/
            build.log
            size.log
            tests.log

      - name: Release (only when the run was started with a tag in "release")
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release }}
        run: |
          mkdir -p rel
          cp "sloop/build/felucca-$VERSION.fwsc" "rel/Kitten-Synths-$VERSION.fwsc"
          (cd kitten-synths && zip -qr ../rel/Kitten-Synths-instalador-$VERSION.zip .)
          sed '1,3d' CHANGELOG.md > notes.md
          {
            echo "# Kitten Synths $VERSION"
            echo
            echo "Firmware para el M-VAVE FM-1 (SLOOP 2.8 + MUUG + parte LITE). **Beta: instalalo bajo tu propio riesgo.** Antes hacé una copia de seguridad."
            echo
            echo "**Cómo instalar:** descargá \`Kitten-Synths-instalador-$VERSION.zip\`, descomprimilo y ejecutá \`servir.py\` (Python 3, Chrome o Edge). El manual está en la carpeta \`docs\` del zip y en el repositorio (\`MANUAL.md\`)."
            echo
            echo "\`Kitten-Synths-$VERSION.fwsc\` es el paquete de firmware suelto, por si preferís instalarlo con otra herramienta."
            echo
            echo "## Cambios"
            cat notes.md
          } > release-notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Kitten Synths $VERSION" --prerelease --notes-file release-notes.md "rel/Kitten-Synths-$VERSION.fwsc" "rel/Kitten-Synths-instalador-$VERSION.zip"
